<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Share to My YouTube</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; background:#0b1220; color:#f8fafc; font-family:system-ui,-apple-system,Roboto,Arial,sans-serif; padding:24px 16px; }
  main { max-width:540px; margin:32px auto; border:1px solid #284361; border-radius:20px; background:#142237; padding:22px; }
  h1 { font-size:24px; margin:0 0 12px; }
  p { line-height:1.5; color:#cbd5e1; }
  .info { border:1px solid #4e7096; padding:12px; border-radius:12px; font-size:14px; margin:16px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  input { display:block; width:100%; border:1px solid #607a9d; background:#071322; color:white; border-radius:11px; padding:13px 12px; font-size:16px; }
  button,a { display:block; width:100%; min-height:44px; margin-top:12px; border-radius:10px; padding:12px; text-align:center; text-decoration:none; font-size:15px; font-weight:650; }
  button { background:#2563eb; color:#fff; border:none; }
  a { color:#bfdbfe; border:1px solid #365579; }
  .hint {font-size:13px;}
</style>
</head>
<body>
<main>
<h1>Share to My YouTube</h1>
<p id="intro">Checking the shared link…</p>
<div class="info" id="status" role="status" aria-live="polite">Reading Android Share data…</div>
<form id="manual-form">
<label for="video-link">YouTube link</label>
<input id="video-link" type="text" inputmode="url" autocomplete="off" placeholder="Long-press here, then Paste">
<button type="submit">Add to Watch Queue automatically</button>
</form>
<p class="hint">If Brave did not send the address, copy the link in Brave, long-press the field and choose Paste. Automatic clipboard access is not required.</p>
<a href="./?page=queue">Open Watch Queue manually</a>
</main>
<script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.search);
  const present = ['url','text','title'].filter(key => params.has(key));
  const values = present.map(key => params.get(key));
  function videoId(rawValue) {
    const raw = String(rawValue || '').trim();
    // A normal Android text share can contain a title followed by the link.
    const tokens = raw.match(/https?:\/\/[^\s<>"']+/gi) || [];
    for (const token of [...tokens,raw]) {
      try {
        const value=token.replace(/[),.;!?\]\}]+$/, '');
        const url=new URL(value);
        if (!['https:','http:'].includes(url.protocol)) continue;
        const host=url.hostname.toLowerCase();
        let id=null;
        if (host==='youtu.be'||host==='www.youtu.be') id=url.pathname.split('/')[1];
        else if (['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(host)) {
          const segments=url.pathname.split('/').filter(Boolean);
          if (segments[0]==='watch') id=url.searchParams.get('v');
          else if (['shorts','live','embed'].includes(segments[0])) id=segments[1];
        }
        if (/^[A-Za-z0-9_-]{11}$/.test(id || '')) return id;
      } catch (_) {}
    }
    return '';
  }
  function navigateToQueue(id) {
    const target=new URL('./',location.href);
    target.searchParams.set('share_target','1');
    target.searchParams.set('auto_queue','1');
    target.searchParams.set('text','https://www.youtube.com/watch?v='+id);
    // Replace share page and remove the incoming text from history.
    location.replace(target.href);
  }
  const id = values.map(videoId).find(Boolean);
  if (id) {
    document.getElementById('status').textContent='YouTube link received. Opening Watch Queue…';
    document.getElementById('intro').textContent='Your shared link was recognised.';
    navigateToQueue(id);
    return;
  }
  const status=document.getElementById('status');
  if (present.length) {
    status.textContent='Android shared data, but no valid YouTube video link was found. Received fields: '+present.join(', ')+'.';
    document.getElementById('intro').textContent='The app opened, but the shared content was not a supported video URL.';
  } else {
    status.textContent='No shared text or URL was received by this page.';
    document.getElementById('intro').textContent='The PWA opened, but Android did not provide a video address.';
  }
  document.getElementById('manual-form').addEventListener('submit', event => {
    event.preventDefault();
    const value=document.getElementById('video-link').value;
    const pastedId=videoId(value);
    if (!pastedId) {
      status.textContent='Please paste a valid YouTube video URL.';
      return;
    }
    navigateToQueue(pastedId);
  });
})();
</script>
</body>
</html>
