<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My YouTube</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         HEADER
         ===================================== -->

    <header class="app-header">

        <div>

            <h1>MY YOUTUBE</h1>

            <p>
                Your personal YouTube tracker
            </p>

        </div>


        <button
            class="settings-button"
            type="button"
            aria-label="Settings"
        >
            ⚙
        </button>

    </header>



    <!-- =====================================
         MAIN CONTENT
         ===================================== -->

    <main class="app-content">


        <!-- Section title -->

        <section class="section-header">

            <div>

                <h2>New Videos</h2>

                <span class="video-count">
                    2 new
                </span>

            </div>

        </section>



        <!-- =====================================
             VIDEO LIST
             ===================================== -->

        <section class="video-list">


            <!-- =================================
                 VIDEO 1
                 ================================= -->

            <article
                class="video-card"
                data-video-id="example-video-1"
            >


                <!-- Thumbnail -->

                <div class="thumbnail">

                    <div class="thumbnail-placeholder">
                        VIDEO
                    </div>

                </div>



                <!-- Video information -->

                <div class="video-info">


                    <h3>
                        Example New Video
                    </h3>


                    <p class="channel-name">
                        Example Channel
                    </p>


                    <p class="video-date">
                        12 Sep 2026 • 12 min
                    </p>



                    <!-- Main buttons -->

                    <div class="video-actions">


                        <button
                            class="action-button watch-button"
                            type="button"
                        >
                            ▶ Watch
                        </button>


                        <button
                            class="action-button watched-button"
                            type="button"
                        >
                            ○ Watched
                        </button>


                    </div>



                    <!-- Secondary buttons -->

                    <div class="video-actions secondary-actions">


                        <button
                            class="action-button download-button"
                            type="button"
                        >
                            ↓ Download
                        </button>


                        <button
                            class="action-button save-button"
                            type="button"
                        >
                            ☆ Save
                        </button>


                    </div>


                </div>

            </article>



            <!-- =================================
                 VIDEO 2
                 ================================= -->

            <article
                class="video-card"
                data-video-id="example-video-2"
            >


                <!-- Thumbnail -->

                <div class="thumbnail">

                    <div class="thumbnail-placeholder">
                        VIDEO
                    </div>

                </div>



                <!-- Video information -->

                <div class="video-info">


                    <h3>
                        Another Example Video
                    </h3>


                    <p class="channel-name">
                        Another Channel
                    </p>


                    <p class="video-date">
                        11 Sep 2026 • 8 min
                    </p>



                    <!-- Main buttons -->

                    <div class="video-actions">


                        <button
                            class="action-button watch-button"
                            type="button"
                        >
                            ▶ Watch
                        </button>


                        <button
                            class="action-button watched-button"
                            type="button"
                        >
                            ○ Watched
                        </button>


                    </div>



                    <!-- Secondary buttons -->

                    <div class="video-actions secondary-actions">


                        <button
                            class="action-button download-button"
                            type="button"
                        >
                            ↓ Download
                        </button>


                        <button
                            class="action-button save-button"
                            type="button"
                        >
                            ☆ Save
                        </button>


                    </div>


                </div>

            </article>


        </section>

    </main>



    <!-- =====================================
         BOTTOM NAVIGATION
         ===================================== -->

    <nav class="bottom-navigation">


        <button
            class="nav-button active"
            type="button"
        >

            <span class="nav-icon">
                ●
            </span>

            <span>
                New
            </span>

        </button>



        <button
            class="nav-button"
            type="button"
        >

            <span class="nav-icon">
                ☆
            </span>

            <span>
                Saved
            </span>

        </button>



        <button
            class="nav-button"
            type="button"
        >

            <span class="nav-icon">
                ✓
            </span>

            <span>
                Watched
            </span>

        </button>



        <button
            class="nav-button"
            type="button"
        >

            <span class="nav-icon">
                ▣
            </span>

            <span>
                Channels
            </span>

        </button>


    </nav>



    <!-- =====================================
         JAVASCRIPT
         ===================================== -->

    <script src="app.js"></script>


</body>

</html>
