<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My YouTube</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         HEADER
         ===================================== -->

    <header class="app-header">

        <div>

            <h1>MY YOUTUBE</h1>

            <p>
                Your personal YouTube tracker
            </p>

        </div>


        <button
            class="settings-button"
            type="button"
            aria-label="Settings"
        >
            ⚙
        </button>

    </header>



    <!-- =====================================
         MAIN CONTENT
         ===================================== -->

    <main class="app-content">


        <!-- Section title -->

        <section class="section-header">

            <div>

                <h2>New Videos</h2>

                <span class="video-count">
                    2 new
                </span>

            </div>

        </section>



        <!-- =====================================
             VIDEO LIST
             ===================================== -->

        <section class="video-list"></section>


    </main>



    <!-- =====================================
         BOTTOM NAVIGATION
         ===================================== -->

    <nav class="bottom-navigation">


        <button
            class="nav-button active"
            type="button"
        >

            <span class="nav-icon">
                ●
            </span>

            <span>
                New
            </span>

        </button>



        <button
            class="nav-button"
            type="button"
        >

            <span class="nav-icon">
                ☆
            </span>

            <span>
                Saved
            </span>

        </button>



        <button
            class="nav-button"
            type="button"
        >

            <span class="nav-icon">
                ✓
            </span>

            <span>
                Watched
            </span>

        </button>



        <button
            class="nav-button"
            type="button"
        >

            <span class="nav-icon">
                ▣
            </span>

            <span>
                Channels
            </span>

        </button>


    </nav>



    <!-- =====================================
         JAVASCRIPT
         ===================================== -->

    <script src="app.js"></script>


</body>

</html>
